name: EAS Preview

# Publishes an EAS Update preview for every pull request and comments the QR
# code on the PR, so a change can be opened on a real phone before it merges.
on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # `secrets` is not available in a job-level `if`, so the check lives in its
  # own job and the real work depends on its output. The preview is SKIPPED
  # rather than failed while EXPO_TOKEN is unset — a red X on every PR just
  # teaches everyone to ignore CI.
  check:
    name: Check EAS credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview skipped::EXPO_TOKEN is not set. Create one at https://expo.dev/settings/access-tokens and add it as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  preview:
    name: Publish preview
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Both expo/expo-github-action uses below (this one and
      # /preview@v8 further down) are knowingly still on v8 (node20) — no
      # node24 major exists for this action as of this bump (2026-08-27).
      # Retire once one ships, or sooner if GitHub stops force-running
      # node20 actions on node24 (it does so today; that is transition
      # behavior, not a guarantee).
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # TEMPORARY DIAGNOSTIC, ADDED 2026-08-27. Runs BEFORE the publish step,
      # always (not just on failure) — the owner's four verification
      # criteria include "resolves to the expected Expo project
      # (b9014104-7522-4f9a-8a18-a3bda56e1e17, owner dindavid)", which is
      # independent of whether the publish itself succeeds. A different
      # valid token could authenticate cleanly and resolve to a DIFFERENT
      # project, and the job would go green while publishing this app's
      # preview somewhere else — green alone does not establish criterion 3,
      # so identity is captured unconditionally, not only in the failure path.
      #
      # `eas whoami` (an alias for `eas account:view`, confirmed against
      # eas-cli's own source — packages/eas-cli/src/commands/account/view.ts
      # declares `static override aliases = ['whoami']`) prints the
      # authenticated account/display name plus every organization account
      # it can access, with role per account — no confirmed `--json` mode in
      # that source, so plain output only. This narrows criterion 3 (which
      # ACCOUNTS the token can see) but does not fully settle it on its own.
      #
      # `eas project:info` (read-only, never publishes) is what actually
      # answers "resolves to which project" — it resolves app.json's
      # owner/slug/extra.eas.projectId against the authenticated identity
      # and prints the resolved fullName + id, or fails with the same
      # not-authorized shape the publish step hits, naming the exact
      # project id it tried. On a GREEN run, nothing else in this workflow
      # names the project at all — the Expo preview comment's shape on this
      # PR is unproven and the failure-path diagnostic below is
      # `if: failure()` only — so a green publish alone could not have
      # distinguished "published to the right project" from "published to
      # a project this token happens to have access to." Confirmed manually
      # against the correct dindavid token before adding this line: exit 0,
      # `fullName  @dindavid/kosher-app`, `ID  b9014104-7522-4f9a-8a18-a3bda56e1e17`
      # — matching app.json exactly.
      - name: Whoami + project:info (temporary — identity + project resolution)
        run: |
          set +e
          OUTPUT=$(eas whoami 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            ESCAPED=$(printf '%s' "$OUTPUT" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::warning title=eas whoami failed::${ESCAPED}"
          else
            ESCAPED=$(printf '%s' "$OUTPUT" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::notice title=eas whoami::${ESCAPED}"
          fi
          OUTPUT2=$(eas project:info 2>&1)
          STATUS2=$?
          echo "$OUTPUT2"
          if [ $STATUS2 -ne 0 ]; then
            ESCAPED2=$(printf '%s' "$OUTPUT2" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::warning title=eas project:info failed::${ESCAPED2}"
          else
            ESCAPED2=$(printf '%s' "$OUTPUT2" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::notice title=eas project:info::${ESCAPED2}"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview
        id: publish
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --branch pr-${{ github.event.pull_request.number }} --auto

      # TEMPORARY DIAGNOSTIC, ADDED 2026-08-27, TO BE REMOVED once the real
      # cause of "Could not create a new EAS Update" is found and fixed.
      #
      # expo/expo-github-action/preview@v8 wraps `eas update` via
      # @actions/exec's getExecOutput and only surfaces a generic
      # "Could not create a new EAS Update" as a check-run annotation —
      # the real eas-cli stderr (attached as `error.cause` in the action's
      # own source, src/eas.ts's createUpdate()) is never turned into an
      # annotation, only into the raw job log, which this session and the
      # Reviewer's both hit a confirmed, repeated 403 ("Must have admin
      # rights to Repository") trying to read directly. Re-running the
      # exact same command here, un-wrapped, turns that stderr into a
      # public ::error:: annotation instead — the same technique already
      # proven today for scripts/shared/run-script-tests.mjs.
      - name: Diagnose EAS Update failure (temporary)
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          set +e
          OUTPUT=$(eas update --branch "pr-${{ github.event.pull_request.number }}" --auto --non-interactive 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            ESCAPED=$(printf '%s' "$OUTPUT" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::error title=Real eas-cli stderr::${ESCAPED}"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
